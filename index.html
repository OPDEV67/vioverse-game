/* Extra detail pass — companion silhouettes, reference-inspired illustrated discovery rarity gallery */
.vv-locked{isolation:isolate}
.vv-locked .vv-locked-art{position:absolute;inset:4px;z-index:0;pointer-events:none;opacity:.33;filter:grayscale(1) brightness(.33) sepia(.12);background:url('assets/seraphine.webp') center 18%/cover no-repeat;mask-image:linear-gradient(180deg,#000 4%,#0008 65%,transparent 98%)}
.vv-locked.epic .vv-locked-art{filter:grayscale(1) brightness(.33) sepia(.4)}
.vv-locked>*:not(.vv-locked-art){position:relative;z-index:2}
.vv-companion.rare .vv-locked-art{filter:grayscale(1) brightness(.33) sepia(.2) hue-rotate(170deg);background-position:55% 17%}
.vv-companion.mythic .vv-locked-art{filter:grayscale(1) brightness(.31) sepia(.5) hue-rotate(285deg);background-position:32% 20%}
.vv-companion.legendary .vv-locked-art{filter:grayscale(1) brightness(.32) sepia(.8);background-position:62% 21%}
.vv-discovery-tile .vv-artbox{font-size:0;background-image:url('assets/discovery-codex.svg');background-size:500% 100%;background-repeat:no-repeat;border-bottom:1px solid var(--tile-color,#996fc1);box-shadow:inset 0 -20px 23px #0b071db3}
.vv-discovery-tile:nth-child(1) .vv-artbox{background-position:0% 50%}
.vv-discovery-tile:nth-child(2) .vv-artbox{background-position:25% 50%}
.vv-discovery-tile:nth-child(3) .vv-artbox{background-position:50% 50%}
.vv-discovery-tile:nth-child(4) .vv-artbox{background-position:75% 50%}
.vv-discovery-tile:nth-child(5) .vv-artbox{background-position:100% 50%}
.vv-discovery-tile{box-shadow:0 0 0 1px #bd8ce322,0 7px 22px #03010a9e}
.vv-discovery-tile .vv-artbox{height:142px}
.vv-discovery-art img{transform:scale(1.23);object-position:center 18%}
.vv-companion .vv-locked-symbol{opacity:.9}
.vv-panel{overflow:hidden}
.vv-view .vv-panel .vv-button{max-width:100%}

/* Elegant filigree overlay anchored to each rarity frame, independent of card content. */
.vv-companion .vv-frame-detail{position:absolute;inset:0;z-index:6;pointer-events:none;background:url('assets/filigree-frame.svg') center center/100% 100% no-repeat;filter:drop-shadow(0 0 7px #b47affb6)}
.vv-companion.rare .vv-frame-detail{filter:hue-rotate(44deg) drop-shadow(0 0 7px #759ffd)}
.vv-companion.mythic .vv-frame-detail{filter:hue-rotate(310deg) drop-shadow(0 0 8px #ed6bc6)}
.vv-companion.legendary .vv-frame-detail{filter:sepia(.6) hue-rotate(322deg) saturate(1.5) drop-shadow(0 0 8px #e9b77a)}
.vv-companion.epic .vv-frame-detail{filter:drop-shadow(0 0 7px #b37de5)}
.vv-companion .vv-cardface{z-index:0}
.vv-companion .vv-cardface:before{z-index:3}

.vv2-root :where(button){font-family:inherit}
.vv2-head{display:flex;justify-content:space-between;align-items:center;gap:20px;
  margin:0 0 21px;padding:5px 2px 12px;border-bottom:1px solid #9465af66}
.vv2-eyebrow{display:flex;align-items:center;gap:10px;color:var(--vv2-gold);
  font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:10px}
.vv2-eyebrow:before,.vv2-eyebrow:after{content:'✧';font:17px Georgia,serif;color:#e2b2ff}
.vv2-head h2{font:600 clamp(23px,2.7vw,35px)/1.24 Cinzel,Georgia,serif!important;
  text-shadow:0 0 20px #c06ffd6b;margin:5px 0 7px;letter-spacing:.035em}
.vv2-head p{margin:0;color:#d3bde1;font-size:12px;line-height:1.5}
.vv2-points{display:inline-flex;gap:10px;align-items:center;white-space:nowrap;
  padding:11px 17px;border:1px solid #bf83e6;border-radius:30px;
  background:linear-gradient(90deg,#34214bdd,#231334eb);box-shadow:0 0 21px #7b33c039}
.vv2-points span:first-child{font-size:24px;color:#ddb2ff;text-shadow:0 0 16px #ba6bf7}
.vv2-points strong{font:600 16px Cinzel,serif;color:#fff4ff}
.vv2-points small{font-size:11px;color:#d3b8e6}

.vv2-layout{display:grid;grid-template-columns:minmax(205px,270px) minmax(0,1fr) minmax(240px,295px);
  gap:17px;align-items:start}
.vv2-side{min-width:0;display:grid;gap:14px}
.vv2-surface{position:relative;overflow:hidden;background:linear-gradient(150deg,#21122fed,#10091cf7 78%);
  border:1px solid #9d6ac3;border-radius:13px;box-shadow:inset 0 0 0 1px #b277ed22,0 12px 28px #05020bc2}
.vv2-surface:before{content:'✦';position:absolute;left:50%;top:-9px;transform:translateX(-50%);
  font:18px Georgia,serif;color:#e0b1ff;text-shadow:0 0 11px #bc70f7;z-index:2}
.vv2-portrait{position:relative;min-height:365px;border-color:#d5a0ff;
  box-shadow:0 0 0 2px #37194d,0 0 23px #a052e066;background:#11071b}
.vv2-portrait:after{content:'';position:absolute;inset:8px;border:1px solid #f1bdfb79;border-radius:6px;pointer-events:none}
.vv2-portrait img{position:absolute;inset:0;display:block;width:100%;height:100%;
  object-fit:cover;object-position:center 12%;filter:saturate(1.07)}
.vv2-portrait-dim{position:absolute;inset:35% 0 0;
  background:linear-gradient(transparent,#14091dcc 42%,#0c0717f8 99%)}
.vv2-portrait-top{position:absolute;top:14px;left:13px;right:13px;display:flex;justify-content:space-between;align-items:center}
.vv2-rarity{font-size:10px;letter-spacing:.1em;font-weight:700;color:#ffedff;padding:6px 9px;
  border:1px solid #d2a0ff;background:#482264ee;border-radius:6px}
.vv2-portrait-top .ornament{font:22px Georgia,serif;color:#f1c7fb;text-shadow:0 0 14px #eab1fa}
.vv2-portrait-caption{position:absolute;left:16px;right:16px;bottom:14px;text-align:center}
.vv2-portrait-caption h3{font:600 25px Cinzel,Georgia,serif!important;margin:0 0 4px;letter-spacing:.04em;text-shadow:0 2px 10px #000}
.vv2-portrait-caption p{color:#e8c8fa;font-size:11px;letter-spacing:.06em;margin:0 0 14px}
.vv2-level-label{display:flex;justify-content:space-between;font-size:10px;color:#e8d8f5;margin:0 0 5px}
.vv2-progress{height:9px;border:1px solid #8157a4;background:#120821;border-radius:20px;overflow:hidden}
.vv2-progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a450ec,#f0b7fa 76%,#88efcc);
  box-shadow:0 0 13px #d68dff;transition:width .16s linear}
.vv2-panel{padding:18px 16px}
.vv2-panel h3{margin:0 0 13px;color:#fff0ff;font:600 14px Cinzel,Georgia,serif!important;line-height:1.35}
.vv2-divider{height:1px;background:linear-gradient(90deg,transparent,#c090d2,transparent);margin:14px 0}
.vv2-stat{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;
  font-size:11px;border-bottom:1px solid #7c578655;color:#d5c4e7}
.vv2-stat:last-child{border:0}
.vv2-stat strong{color:#fff3fc;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.vv2-stat .vv2-active{color:#92e3c6}
.vv2-aside-note{font-size:11px;color:#bda9ca;line-height:1.7;margin:10px 0 0}
.vv2-cta{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;
  font-size:12px;font-weight:700;padding:11px 10px;color:#fdf0ff;
  background:linear-gradient(180deg,#8b50c9,#562584);border:1px solid #d8a5fa;
  border-radius:8px;box-shadow:inset 0 1px #f2cbff99,0 4px 20px #8d43c474;
  transition:filter .16s,transform .16s}
.vv2-cta:hover{filter:brightness(1.15);transform:translateY(-1px)}
.vv2-cta:focus-visible,.vv2-node:focus-visible,.vv2-navbtn:focus-visible{outline:3px solid #fff0b5;outline-offset:4px}
.vv2-cta:disabled{cursor:not-allowed;opacity:.45;filter:grayscale(.3);transform:none}
.vv2-cta.alt{background:linear-gradient(160deg,#372147,#20112c);border-color:#956dae;box-shadow:inset 0 1px #aa84ca55}
.vv2-cta.gold{border-color:#f0d293;background:linear-gradient(#8d599e,#5a3177)}

.vv2-center{min-width:0}
.vv2-map-border{position:relative;padding:4px;border-radius:17px;border:1px solid #b68de2;
  background:linear-gradient(135deg,#301b4b,#10091f 30%,#211135 70%,#45265a);
  box-shadow:0 0 0 2px #120920,0 0 32px #a253fc33}
.vv2-map-title{display:flex;align-items:center;justify-content:center;gap:12px;
  padding:14px 12px 4px;position:relative;z-index:4;text-align:center}
.vv2-map-title span{color:#e9bbfc;font:19px Georgia,serif;text-shadow:0 0 12px #a84eff}
.vv2-map-title strong{font:600 12px Cinzel,serif;letter-spacing:.18em;color:#f1d9ff}
.vv2-map{width:100%;max-width:760px;margin:0 auto;aspect-ratio:1/1;position:relative;
  isolation:isolate;overflow:hidden;border-radius:50%;
  background:
   radial-gradient(circle at 50% 49%,#3a1653b2 0%,#1b0b30c5 32%,#0a071add 68%,#080511fa 96%),
   url('assets/moonwood-skill-aura.svg') center/cover no-repeat}
.vv2-map:before{content:'';position:absolute;inset:2.5%;border-radius:50%;
  border:2px solid #a86cf7a8;box-shadow:inset 0 0 30px #9b36d63e,0 0 19px #b970f03a;pointer-events:none}
.vv2-map:after{content:'';position:absolute;inset:10%;border-radius:50%;border:1px dashed #d8a6f552;pointer-events:none}
.vv2-connectors{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.vv2-connectors .arc{fill:none;stroke:url(#vv2Branch);stroke-width:2.5;stroke-linecap:round;
  stroke-linejoin:round;filter:drop-shadow(0 0 5px #c383ffcc)}
.vv2-connectors .ring{fill:none;stroke:#bc8bff66;stroke-width:2}
.vv2-connectors .ring.thin{stroke:#c69df344;stroke-width:1;stroke-dasharray:4 13}
.vv2-connectors .spark{fill:#e8baff;filter:drop-shadow(0 0 6px #edc2ff)}
.vv2-connectors .crystal{fill:#ae82e7;stroke:#f3c1ff;stroke-width:1.5;filter:drop-shadow(0 0 7px #bd7dff)}
.vv2-core{position:absolute;width:22%;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  border-radius:50%;border:3px solid #ecbfff;padding:7px;
  background:radial-gradient(circle,#52227e 12%,#0b091b 70%);
  box-shadow:0 0 0 6px #462063b5,0 0 0 8px #f0aeff7a,0 0 28px #cb66fd}
.vv2-core img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:50%;border:1px solid #f0daff}
.vv2-core:after{content:'☾';display:grid;place-items:center;position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);
  color:#fff2c6;background:#3d145b;border:1px solid #edc6ff;border-radius:50%;font:15px Georgia,serif;width:28px;height:28px}
.vv2-node{--node:#bc8cf2;position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);z-index:3;
  width:13%;min-width:0;aspect-ratio:1;border:2px solid var(--node);border-radius:50%;
  background:radial-gradient(circle at 45% 35%,#573280,#210f38 65%,#110921);
  color:#f8e2ff;cursor:pointer;display:grid;place-items:center;
  box-shadow:inset 0 0 13px #e3a5ff2c,0 0 0 3px #170b28db,0 0 20px #9d4be68a;
  transition:transform .18s ease,box-shadow .18s,border-color .18s,filter .18s}
.vv2-node svg{width:49%;height:49%;filter:drop-shadow(0 0 4px #a763ff)}
.vv2-node .glyph-main{stroke:#e9d8ff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.vv2-node .glyph-fill{stroke:#f5d3ff;fill:#c796ff;stroke-width:1}
.vv2-node:hover{transform:translate(-50%,-50%) scale(1.09);box-shadow:inset 0 0 16px #ffcfff44,0 0 0 4px #391750,0 0 26px var(--node)}
.vv2-node[aria-pressed="true"]{border-color:#fff2bc;box-shadow:inset 0 0 19px #eed0ff55,0 0 0 4px #4b2465,0 0 0 7px #e6baec7a,0 0 28px #f4b2f2}
.vv2-node.learned{--node:#75dcb6;background:radial-gradient(circle,#2f7967,#122e34 65%,#0d1924)}
.vv2-node.active{--node:#ebc486;background:radial-gradient(circle,#8c578c,#482052 60%,#25122c)}
.vv2-node.planned{--node:#936caf;background:radial-gradient(circle,#523068,#1b1032 60%,#110a22)}
.vv2-node.locked{--node:#6f527e;background:#170f24;filter:saturate(.56);opacity:.82}
.vv2-node.maxed{--node:#f9d795;background:radial-gradient(circle,#8f6981,#392040)}
.vv2-node:before{content:'✦';position:absolute;font:11px Georgia,serif;top:-15%;color:var(--node);text-shadow:0 0 8px var(--node)}
.vv2-node:after{content:attr(data-short);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  font:700 clamp(7px,.7vw,10px)/1.25 'DM Sans',sans-serif;min-width:88px;max-width:122px;text-align:center;
  color:#e9daef;text-shadow:0 2px 8px #000,0 0 10px #3c115b;pointer-events:none}
.vv2-node .vv2-lock{position:absolute;bottom:-6px;right:-6px;display:grid;place-items:center;font-size:11px;background:#1a0d2a;
  width:23px;height:23px;border:1px solid #9a70b7;border-radius:50%;filter:none}
.vv2-orbit-star{position:absolute;left:var(--x);top:var(--y);width:7px;height:7px;transform:translate(-50%,-50%) rotate(45deg);
  background:#f1c3ff;box-shadow:0 0 14px #d38afc;pointer-events:none;z-index:1}
.vv2-map-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:8px 17px 15px;color:#c8b1dd;font-size:11px}
.vv2-map-foot b{color:#edcdfa;font-weight:700}
.vv2-legend{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:#bea5d0}
.vv2-legend span{display:inline-flex;align-items:center;gap:5px}
.vv2-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c)}
.vv2-subnav{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:15px}
.vv2-navbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #6f4c93;
  background:#1b102be8;color:#d9c1ed;font-size:11px;border-radius:8px;padding:8px 10px}
.vv2-navbtn[aria-pressed="true"],.vv2-navbtn:hover{background:#522b74;border-color:#dfabfd;color:#fff0ff}

.vv2-selection{display:flex;align-items:center;gap:12px;margin:11px 0 15px}
.vv2-selection-glyph{--node:#ab80e0;flex:none;display:grid;place-items:center;width:57px;height:57px;border-radius:50%;
  border:2px solid var(--node);background:radial-gradient(circle,#502272,#201034);
  box-shadow:0 0 14px #9c51da71}
.vv2-selection-glyph svg{width:35px;height:35px}.vv2-selection-glyph .glyph-main{stroke:#ead3ff;stroke-width:2.3;fill:none}
.vv2-selection-glyph .glyph-fill{fill:#d2a6ff;stroke:#eed2ff}
.vv2-selection-name{min-width:0}.vv2-selection-name h3{font:600 17px/1.3 Cinzel,Georgia,serif!important;margin:0 0 6px}
.vv2-chip{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:#e8bff7;border:1px solid #8f5dad;
  border-radius:7px;background:#342046;padding:5px 8px;display:inline-block}
.vv2-details-text{font-size:12px;line-height:1.8;color:#d9c9e5;margin:13px 0}
.vv2-h4{font:600 12px Cinzel,Georgia,serif;color:#f8ddae;margin:14px 0 8px}
.vv2-perk{display:flex;gap:10px;justify-content:space-between;align-items:center;font-size:11px;
  padding:9px;border:1px solid #62447f;border-radius:7px;background:#291837;margin:7px 0}
.vv2-perk span{color:#e2cfeb}.vv2-perk strong{white-space:nowrap;color:#a4ebc9}
.vv2-perk small{color:#a99ac0}
.vv2-note{border-left:2px solid #ac74d3;padding:9px 12px;background:#311e3f90;color:#dbc5eb;font-size:11px;line-height:1.55}
.vv2-requirement{display:flex;justify-content:space-between;gap:10px;padding:8px;font-size:11px;
  background:#1b112b;border:1px solid #614484;border-radius:7px;margin:9px 0}
.vv2-requirement strong{color:#9debc9}.vv2-requirement.no strong{color:#deacc0}
.vv2-details-buttons{display:grid;gap:10px;margin-top:17px}
.vv2-help{font-size:10px;line-height:1.65;color:#af98c4}
.vv2-lore{text-align:center;font:italic 12px Georgia,serif;color:#e0bfe5;line-height:1.7;margin:9px 0}
.vv2-footer{margin-top:19px;padding:15px 19px;display:flex;gap:12px;align-items:center;justify-content:space-between;
  background:linear-gradient(90deg,#1d1230ee,#120b21f7);border:1px solid #714b90;border-radius:11px}
.vv2-footer p{margin:0;font-size:11px;color:#cfbadf;line-height:1.5}
.vv2-footer-actions{display:flex;gap:10px;flex-wrap:wrap}.vv2-footer-actions .vv2-cta{width:auto;white-space:nowrap}
.vv2-ambient-flower{position:absolute;z-index:0;pointer-events:none;font:28px Georgia,serif;color:#db9ff7;
  text-shadow:0 0 13px #ab4efa;opacity:.55}
.vv2-root .vv2-stage-scroll{overflow:visible}
@media(max-width:1460px){
 .vv2-layout{grid-template-columns:minmax(190px,240px) minmax(0,1fr) minmax(225px,265px);gap:12px}
 .vv2-panel{padding:15px 13px}.vv2-node:after{font-size:9px;min-width:70px}
 .vv2-portrait{min-height:345px}
}
@media(max-width:1170px){
 .vv2-layout{grid-template-columns:minmax(190px,260px) minmax(0,1fr)}
 .vv2-side.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;align-items:start}
 .vv2-side.right>.vv2-surface{height:100%}
 .vv2-portrait{min-height:400px}
 .vv2-head{align-items:start}
}
@media(max-width:840px){
 .vv2-layout{grid-template-columns:1fr}
 .vv2-side.left{grid-template-columns:minmax(180px,.75fr) 1fr;align-items:stretch}
 .vv2-portrait{min-height:305px}
 .vv2-side.right{grid-template-columns:1fr 1fr}
 .vv2-center{grid-row:2}
 .vv2-head{flex-wrap:wrap}
 .vv2-map{max-width:720px}
 .vv2-node:after{font-size:10px}
}
@media(max-width:620px){
 .vv2-side.left,.vv2-side.right{grid-template-columns:1fr}
 .vv2-portrait{min-height:270px}
 .vv2-portrait img{object-position:center 24%}
 .vv2-map-title strong{font-size:10px;letter-spacing:.1em}
 .vv2-node{width:14%}
 .vv2-node:after{font-size:8px;max-width:72px;min-width:59px;top:calc(100% + 4px)}
 .vv2-node .vv2-lock{width:16px;height:16px;font-size:8px;right:-4px;bottom:-4px}
 .vv2-points{padding:7px 12px}
 .vv2-head h2{font-size:22px!important}
 .vv2-map-foot{justify-content:center}
 .vv2-footer{align-items:stretch;flex-direction:column}
 .vv2-footer-actions .vv2-cta{white-space:normal}
 .vv2-subnav{gap:5px}.vv2-navbtn{font-size:10px;padding:7px}
}
@media(prefers-reduced-motion:reduce){
 .vv2-root *, .vv2-root *:before,.vv2-root *:after{animation:none!important;transition:none!important}
}

function updateScreen(){let u=updateInfo,remote=u.manifest;return `<div class="row"><div><h2>↻ Update Game</h2><p class="muted small">Updates are downloaded from this website after a new version is published.</p></div><span class="pill">Installed v${BUILD_VERSION}</span></div><section class="panel"><h3>Game updater</h3><p class="muted">${u.message}</p>${remote&&u.state==='available'?`<div class="panel"><h3>v${remote.version} — ${escapeText(remote.title||'New update')}</h3><p>${escapeText(remote.notes||'A new version is available.')}</p></div>`:''}<div class="row">${button(u.state==='checking'?'Checking…':'↻ Check for Updates','checkupdate',u.state==='checking')}${u.state==='available'?button('⬇ Update Game Now','installupdate',false):''}</div><p class="muted small">Your progress stays in this browser's local storage. Do not clear website data or switch website addresses if you want to keep your save. New releases must first be uploaded to GitHub and deployed by GitHub Pages.</p></section>`}

async function checkGameUpdate(silent=false){if(updateCheckBusy)return;updateCheckBusy=true;if(!silent){updateInfo={...updateInfo,state:'checking',message:'Checking the published version…'};render()}try{if(location.protocol==='file:')throw Error('Online updates require the hosted GitHub Pages website, not a local HTML file.');const url=new URL('version.json',location.href);url.searchParams.set('check',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('version.json is not published yet (HTTP '+response.status+').');const data=await response.json();if(!/^\d+\.\d+\.\d+$/.test(data.version)||typeof data.build!=='string')throw Error('Invalid version.json format.');const newer=compareVersions(data.version,BUILD_VERSION)>0 || (compareVersions(data.version,BUILD_VERSION)===0&&data.build!==BUILD_ID);updateInfo={state:newer?'available':'current',manifest:data,message:newer?'New update detected: v'+data.version+'. Automatic installation is queued.':'You are running the latest published version (v'+BUILD_VERSION+').'};if(newer)queueAutoUpdate();}catch(err){if(!silent)updateInfo={state:'error',manifest:null,message:'Could not check for updates: '+err.message}}finally{updateCheckBusy=false}if(!silent)render();else if(page==='Update Game'){const statusNode=document.getElementById('vv-update-message');if(statusNode)statusNode.textContent=updateInfo.message}}

function vvRollCompanion(){
 const p=s.gachaPity;let rarity;
 if(p.legendary>=49)rarity='Legendary';else if(p.epic>=19)rarity=Math.random()<10/12?'Epic':'Legendary';
 else if(p.rare>=9){const r=Math.random();rarity=r<.70?'Rare':r<.95?'Epic':'Legendary'}
 else{const r=Math.random()*100;rarity=r<60?'Common':r<88?'Rare':r<98?'Epic':'Legendary'}
 p.rare++;p.epic++;p.legendary++;if(rarity!=='Common')p.rare=0;if(rarity==='Epic'||rarity==='Legendary')p.epic=0;if(rarity==='Legendary')p.legendary=0;
 return VV_COMPANIONS.find(c=>c.rarity===rarity);
}
function vvDoPull(count){
 const cost=count===10?90:10;if(s.stardust<cost){toast('You need '+cost+' Stardust. Exchange gathered Wood in the Moonlit Shop.');return}
 s.stardust-=cost;const results=[];
 for(let i=0;i<count;i++){const c=vvRollCompanion(),duplicate=Number(s.ownedCompanions[c.id]||0)>0;if(duplicate)s.stardust+=3;else s.ownedCompanions[c.id]=1;results.push({id:c.id,rarity:c.rarity,duplicate});s.gachaPulls++;note(duplicate?'✦ Duplicate '+c.name+' converted into 3 Stardust.':'✦ New companion: '+c.name+' ('+c.rarity+').');}
 s.lastSummon=results;const dupes=results.filter(r=>r.duplicate).length,detail='Summoned '+count+' · spent '+cost+' Stardust'+(dupes?' · '+dupes+' duplicate(s), +'+(dupes*3)+' Stardust':'');
 s.economyHistory.unshift({type:'summon',detail,at:Date.now()});s.economyHistory=s.economyHistory.slice(0,20);save();toast(count===10?'✦ Ten summons complete · '+dupes+' duplicate(s) converted.':'✦ Summon complete · '+(dupes?'duplicate converted to Stardust.':'new companion added.'));render();
}

function vvHandleEconomyAction(action){
 if(action==='pull-one'){vvDoPull(1);return}
 if(action==='pull-ten'){vvDoPull(10);return}
 if(action.startsWith('exchange-')){const amount=Number(action.slice(9));if(![1,4,20].includes(amount))return;const cost=amount*250;if(s.wood<cost){toast('Not enough Wood for this exchange.');return}s.wood-=cost;s.stardust+=amount;const detail=fmt(cost)+' Wood → '+amount+' Stardust';s.economyHistory.unshift({type:'exchange',detail,at:Date.now()});s.economyHistory=s.economyHistory.slice(0,20);note('✧ Exchanged '+detail+'.');save();toast('✧ '+detail+' exchanged successfully.');render();return}
 if(action==='equip-none'||action.startsWith('equip-')){const id=action==='equip-none'?'':action.slice(6);if(id&&!VV_COMPANIONS.some(c=>c.id===id&&Number(s.ownedCompanions[id]||0)>0)){toast('Discover this companion before equipping it.');return}s.equippedCompanion=id;const c=VV_COMPANIONS.find(x=>x.id===id);note('✦ Support companion set: '+(c?c.name:'None')+'.');save();toast(c?'✦ '+c.name+' equipped · '+c.passive+'.':'Support companion unequipped.');render()}
}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action||'';if(!/^(pull-one|pull-ten|exchange-(1|4|20)|equip-(bramble|nyra|lunelle|astra)|equip-none)$/.test(action))return;event.preventDefault();event.stopImmediatePropagation();vvHandleEconomyAction(action)},true);

/* The original flip handler rerendered the whole page; stop it before its bubbling listener.

 if(front&&back){front.hidden=flipped;back.hidden=!flipped}
},true);

  const speedAt=rank=>8/(1+.35+rank*.06+(s.awakened?.15:0)+(s.restored?.1:0));
  const escapeValue=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function badge(label,value){return `<div class="vv2-stat"><span>${label}</span><strong>${value}</strong></div>`}
  function btn(label,action,extra=''){return `<button class="vv2-cta ${extra}" type="button" data-vv2-action="${action}">${label}</button>`}
  function nodeGlyph(item){return vvSkillGlyph(item.icon)}
  function mapSvg(){
    const paths=[
      'M350 95 Q240 107 189 210','M350 95 Q460 107 511 210',
      'M189 210 Q124 266 91 364','M511 210 Q576 266 609 364',
      'M189 210 Q251 265 350 350','M511 210 Q449 265 350 350',
      'M91 364 Q115 450 196 504','M609 364 Q585 450 504 504',
      'M196 504 Q259 580 350 616','M504 504 Q441 580 350 616',
      'M350 350 Q350 481 350 616'
    ];
    const stars=[[350,36],[350,670],[34,350],[670,350],[120,120],[580,120],[110,582],[590,582],[226,93],[484,93],[226,610],[484,610]];
    return `<svg class="vv2-connectors" viewBox="0 0 700 700" role="presentation" aria-hidden="true">
      <defs>
        <linearGradient id="vv2Branch" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#975cff"/><stop offset=".45" stop-color="#f4c9ff"/><stop offset="1" stop-color="#b962ff"/>
        </linearGradient>
      </defs>
      <circle class="ring" cx="350" cy="350" r="310"/>
      <circle class="ring thin" cx="350" cy="350" r="274"/>
      <circle class="ring thin" cx="350" cy="350" r="226"/>
      ${paths.map(d=>`<path class="arc" d="${d}"/>`).join('')}
      ${stars.map(([x,y])=>`<path class="spark" d="M${x} ${y-7}L${x+5} ${y}L${x} ${y+7}L${x-5} ${y}Z"/>`).join('')}
      ${[[350,95],[189,210],[511,210],[91,364],[609,364],[196,504],[504,504],[350,616]].map(([x,y])=>`<path class="crystal" d="M${x} ${y-13}l7 13-7 13-7-13Z"/>`).join('')}
    </svg>`;
  }
  function renderNodes(){
    return NODES.map(n=>{
      const st=state[n.id]();
      const short=n.id==='mastery'?'MASTER '+s.skillSpent+'/5':n.name;
      const lock=st==='planned'||st==='locked'?'<span class="vv2-lock" aria-hidden="true">🔒</span>':'';
      return `<button class="vv2-node ${st}" type="button" data-vv2-node="${n.id}"
        data-short="${short}" style="--x:${n.x}%;--y:${n.y}%"
        title="${n.name}" aria-label="${n.name} — ${st==='planned'?'future talent':st}"
        aria-pressed="${selected===n.id?'true':'false'}" aria-controls="vv2-inspector">
        ${nodeGlyph(n)}${lock}
      </button>`;
    }).join('');
  }
  function inspector(){
    const n=NODES.find(n=>n.id===selected)||NODES[7];
    const st=state[n.id]();
    const playable=n.id==='mastery';
    const isFoundation=n.id==='foundation';
    const swift=n.id==='swift';
    const maxed=s.skillSpent>=5;
    const nextSpeed=maxed?speedAt(5):speedAt(s.skillSpent+1);
    const status=playable?(maxed?'MAX RANK':'UPGRADE AVAILABLE'):
      isFoundation?'LEARNED':swift?(s.skillSpent>0?'PASSIVE ACTIVE':'TIED TO MASTERY'):'FUTURE TALENT';
    let rows='';
    if(playable){
      rows=badge('Current rank',`${s.skillSpent} / 5`)+
        badge('Current gathering time',speed().toFixed(2)+' sec')+
        badge('Current Mastery efficiency','+'+(s.skillSpent*6)+'%')+
        (maxed?`<p class="vv2-note">Forest Mastery is at maximum rank. Your invested skill points remain saved.</p>`:
          `<h4 class="vv2-h4">NEXT RANK PREVIEW</h4>
           <div class="vv2-perk"><span>Gathering speed multiplier</span><strong>+${(s.skillSpent+1)*6}%</strong></div>
           <div class="vv2-perk"><span>Estimated gathering cycle</span><strong>${nextSpeed.toFixed(2)}s</strong></div>
           <h4 class="vv2-h4">REQUIREMENTS</h4>
           <div class="vv2-requirement ${s.skill<1?'no':''}"><span>✧ Skill points</span>
           <strong>${s.skill} / 1 ${s.skill>=1?'✓':'· Need 1'}</strong></div>`);
    }else if(isFoundation){
      rows=`<div class="vv2-perk"><span>Skill tree access</span><strong>Unlocked ✓</strong></div>
       <div class="vv2-perk"><span>Cost</span><strong>Free</strong></div>`;
    }else if(swift){
      rows=`<div class="vv2-perk"><span>Linked Mastery rank</span><strong>${s.skillSpent} / 5</strong></div>
       <div class="vv2-perk"><span>Efficiency from Mastery</span><strong>+${s.skillSpent*6}%</strong></div>
       <p class="vv2-note">Swift Hands uses the existing Forest Mastery bonus. It does not cost a second skill point.</p>`;
    }else{
      rows=`<div class="vv2-perk"><span>Skill availability</span><strong>Not yet playable</strong></div>
       <p class="vv2-note">This branch is a design preview. No currency or skill points can be spent on it yet.</p>`;
    }
    const action=playable?(maxed?`<button type="button" class="vv2-cta" disabled>✦ Maximum Rank Reached</button>`:
      `<button type="button" class="vv2-cta" data-vv2-action="upgrade" ${s.skill<1?'disabled':''}>✦ Upgrade Forest Mastery</button>`):
       `<button type="button" class="vv2-cta alt" data-vv2-action="${swift?'select-mastery':'back-tree'}">${swift?'View Forest Mastery →':'✦ Explore the constellation'}</button>`;
    return `<div class="vv2-selection">
      <div class="vv2-selection-glyph">${nodeGlyph(n)}</div>
      <div class="vv2-selection-name"><h3>${escapeValue(n.name)}</h3><span class="vv2-chip">${status}</span></div>
    </div>
    <p class="vv2-details-text">${escapeValue(n.story)}</p>
    <div class="vv2-divider"></div>
    <h4 class="vv2-h4">CURRENT PATH</h4>${rows}
    <div class="vv2-details-buttons">${action}
      <button class="vv2-cta alt" type="button" data-page="Legacy">☾ View Moonwood Legacy</button>
    </div>`;
  }
  function layout(){
    return `<section class="vv2-root" id="vv2-skill-page">
      <div class="vv2-head">
        <div><div class="vv2-eyebrow">Moonwood Constellation</div>
        <h2>The Forest Skill Tree</h2>
        <p>Seraphine · Forest Whisperer · Permanent Woodcutting Mastery</p></div>
        <button type="button" class="vv2-points" data-vv2-node="mastery" aria-label="View Forest Mastery and skill point details"><span aria-hidden="true">✧</span><div><strong data-vv2-points>${s.skill}</strong>
        <small> skill points available</small></div></button>
      </div>
      <div class="vv2-layout">
        <aside class="vv2-side left" aria-label="Companion profile">
          <div class="vv2-surface vv2-portrait">
            <img src="assets/seraphine.webp" alt="Seraphine the Forest Whisperer">
            <div class="vv2-portrait-dim"></div>
            <div class="vv2-portrait-top"><span class="vv2-rarity">EPIC ✦ FOREST</span><span class="ornament">✧</span></div>
            <div class="vv2-portrait-caption"><h3>Seraphine</h3><p>Forest Whisperer</p>
              <div class="vv2-level-label"><span>Character Lv. <b data-vv2-charlevel>${level(s.xp)}</b></span>
              <span data-vv2-charpct>${Math.floor(pct(s.xp))}%</span></div>
              <div class="vv2-progress"><i id="vv2-charbar" style="width:${pct(s.xp)}%"></i></div>
            </div>
          </div>
          <div class="vv2-surface vv2-panel">
            <h3>✧ Companion Overview</h3>
            ${badge('🌿 Woodcutting','Lv. <span data-vv2-proflevel>'+level(s.profXp)+'</span>')}
            <div class="vv2-progress" style="margin:7px 0 9px"><i id="vv2-profbar" style="width:${pct(s.profXp)}%"></i></div>
            ${badge('✧ Available skill points','<span data-vv2-points>'+s.skill+'</span>')}
            ${badge('✦ Forest Mastery','Rank <span data-vv2-rank>'+s.skillSpent+'</span> / 5')}
            ${badge('⚡ Gathering time','<span data-vv2-speed>'+speed().toFixed(2)+'</span>s')}
            ${badge('☾ Awakening',s.awakened?'<span class="vv2-active">Awakening I</span>':'Awaiting Moonwood')}
            <p class="vv2-aside-note">The Forest remembers the path you choose. Skill upgrades are saved in this browser.</p>
            <div class="vv2-divider"></div>
            <button type="button" class="vv2-cta alt" data-page="Characters">← Back to Characters</button>
          </div>
        </aside>
        <div class="vv2-center">
          <div class="vv2-map-border">
            <div class="vv2-map-title"><span>✦</span><strong>THE LIVING CONSTELLATION</strong><span>✦</span></div>
            <div class="vv2-stage-scroll">
              <div class="vv2-map" id="vv2-constellation" aria-label="Interactive Forest Skill Tree">
                ${mapSvg()}
                <div class="vv2-core"><img src="assets/seraphine.webp" alt="" aria-hidden="true"></div>
                ${renderNodes()}
              </div>
            </div>
            <div class="vv2-map-foot"><b>✧ Four paths · One whispering forest</b>
              <div class="vv2-legend"><span><i style="--c:#75dcb6"></i> Learned</span>
              <span><i style="--c:#ebc486"></i> Active</span>
              <span><i style="--c:#936caf"></i> Planned</span></div>
            </div>
          </div>
          <div class="vv2-subnav" aria-label="Select a skill">
            ${['foundation','swift','moon','mastery'].map(id=>{
              const n=NODES.find(q=>q.id===id);
              return `<button class="vv2-navbtn" type="button" data-vv2-node="${id}" aria-pressed="${selected===id?'true':'false'}">${id==='mastery'?'✦':id==='moon'?'☾':'❖'} ${n.name}</button>`;
            }).join('')}
          </div>
        </div>
        <aside class="vv2-side right" aria-label="Selected skill details">
          <div class="vv2-surface vv2-panel">
            <h3>✦ Selected Skill</h3>
            <div id="vv2-inspector" aria-live="polite">${inspector()}</div>
          </div>
          <div class="vv2-surface vv2-panel">
            <h3>☾ The Grove Remembers</h3>
            <p class="vv2-lore">“Every tree has a story. We simply need to listen.”</p>
            <div class="vv2-divider"></div>
            ${badge('Awakening I',s.awakened?'Unlocked ✓':'Requires Legacy')}
            ${badge('Woodcutting level','<span data-vv2-proflevel>'+level(s.profXp)+'</span>')}
            <div class="vv2-details-buttons">
              <button type="button" class="vv2-cta alt" data-vv2-action="reset" ${s.skillSpent<=0?'disabled':''}>↶ Reset Forest Mastery</button>
            </div>
            <p class="vv2-help">Reset refunds spent Forest Mastery points. You’ll be asked to confirm; no other progress is removed.</p>
          </div>
        </aside>
      </div>
      <div class="vv2-footer">
        <p>✧ Forest Mastery is playable today. Other branches preview future additions, and never spend your points.</p>
        <div class="vv2-footer-actions">
          <button type="button" class="vv2-cta alt" data-page="Characters">← Characters</button>
          <button type="button" class="vv2-cta" data-page="Legacy">☾ Moonwood Legacy →</button>
        </div>
      </div>
    </section>`;
  }
  function navRender(){
    const nav=document.getElementById('nav');
    nav.innerHTML=vvPages.map(n=>`<button type="button" data-page="${n}" class="${page===n?'active':''}"
      ${page===n?'aria-current="page"':''}><span class="vv-nav-icon" aria-hidden="true">${vvIcons[n]}</span>
      <span class="vv-nav-label">${n}</span></button>`).join('');
  }
  function renderPage(){
    navRender();
    const main=document.getElementById('main');
    main.innerHTML=layout();
    document.getElementById('wood').textContent=fmt(s.wood);
    document.getElementById('essence').textContent=fmt(s.essence);
    document.getElementById('butterfly').textContent=fmt(s.butterfly);
    document.getElementById('level').textContent=level(s.xp);
    const rank=document.getElementById('vv-level-caption');
    if(rank)rank.textContent='Lv. '+level(s.xp);
    const xp=document.querySelector('.vv-level-track i');
    if(xp)xp.style.width=pct(s.xp)+'%';
    lastSignature='';
    sync();
  }
  function setText(selector,value){
    document.querySelectorAll(selector).forEach(el=>{
      const t=String(value);
      if(el.textContent!==t)el.textContent=t;
    });
  }
  function sync(){
    if(page!=='Skill Tree')return;
    setText('[data-vv2-points]',s.skill);
    setText('[data-vv2-rank]',s.skillSpent);
    setText('[data-vv2-speed]',speed().toFixed(2));
    setText('[data-vv2-proflevel]',level(s.profXp));
    setText('[data-vv2-charlevel]',level(s.xp));
    setText('[data-vv2-charpct]',Math.floor(pct(s.xp))+'%');
    for(const [id,p] of [['vv2-charbar',pct(s.xp)],['vv2-profbar',pct(s.profXp)]]){
      const bar=document.getElementById(id);
      if(bar)bar.style.width=Math.max(0,Math.min(100,p))+'%';
    }
    NODES.forEach(n=>{
      const st=state[n.id]();
      document.querySelectorAll(`[data-vv2-node="${n.id}"]`).forEach(el=>{
        if(el.classList.contains('vv2-node')){
          el.className='vv2-node '+st;
          if(n.id==='mastery')el.setAttribute('data-short','MASTER '+s.skillSpent+'/5');
          el.setAttribute('aria-pressed',selected===n.id?'true':'false');
        }else{
          el.setAttribute('aria-pressed',selected===n.id?'true':'false');
        }
      });
    });
    const reset=document.querySelector('[data-vv2-action="reset"]');
    if(reset)reset.disabled=s.skillSpent<=0;
    const signature=[selected,s.skill,s.skillSpent,s.awakened,s.restored,level(s.profXp)].join('|');
    if(signature!==lastSignature){
      const el=document.getElementById('vv2-inspector');
      if(el)el.innerHTML=inspector();
      lastSignature=signature;
    }
  }
  function selectNode(id){
    if(!NODES.some(n=>n.id===id))return;
    selected=id;
    lastSignature='';
    sync();
    if(window.matchMedia && window.matchMedia('(max-width: 840px)').matches){
      const inspect=document.getElementById('vv2-inspector');
      if(inspect)inspect.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
  }
  function upgrade(){
    if(s.skill<1||s.skillSpent>=5)return;
    s.skill--;
    s.skillSpent++;
    save();
    toast('✦ Forest Mastery improved · rank '+s.skillSpent+'/5');
    selected='mastery';
    lastSignature='';
    sync();
  }
  function resetMastery(){
    if(s.skillSpent<=0)return;
    if(!window.confirm('Refund '+s.skillSpent+' invested Forest Mastery points? Your character, resources, and other progress will stay intact.'))return;
    const refund=s.skillSpent;
    s.skill+=refund;
    s.skillSpent=0;
    save();
    toast('✦ '+refund+' Forest Mastery points refunded');
    selected='mastery';
    lastSignature='';
    sync();
  }
  // Turn the character-card action into a real page transition.
  const originalHero=vvHeroCard;
  vvHeroCard=function(){
    return originalHero().replace('data-action="flip"','data-page="Skill Tree"')
      .replace('✦ View skill tree','✦ Open Skill Tree');
  };
  const baseCharacters=typeof vvBaseCharacters==='function'?vvBaseCharacters:vvCharacters;
  vvCharacters=function(){
    const original=baseCharacters().replace('data-action="skill"','data-page="Skill Tree"').replace('Spend 1 skill point','Open Skill Tree');
    const i=original.lastIndexOf('</div>');
    const action=`<div class="vv-panel" style="margin-top:17px;text-align:center">
      <div class="vv-kicker" style="justify-content:center">MOONWOOD CONSTELLATION</div>
      <h3>The Forest Skill Tree</h3>
      <p class="vv-muted">Open Seraphine’s interactive skill constellation, choose a node, and spend Forest Mastery points.</p>
      <div class="vv-actions" style="justify-content:center"><button class="vv-button" data-page="Skill Tree">✦ Open Full Skill Tree →</button></div>
    </div>`;
    return i>=0?original.slice(0,i)+action+original.slice(i):original+action;
  };
  if(!vvPages.includes('Skill Tree'))vvPages.splice(vvPages.indexOf('Characters')+1,0,'Skill Tree');
  vvIcons['Skill Tree']='✧';
  const previousRender=render;
  render=function(){
    if(page==='Skill Tree'){renderPage();return;}
    previousRender();
  };
  const previousRefresh=refreshLiveStats;
  refreshLiveStats=function(){
    previousRefresh();
    if(page==='Skill Tree')sync();
  };
  document.addEventListener('click',function(event){
    const el=event.target.closest('[data-vv2-node],[data-vv2-action]');
    if(!el)return;
    event.preventDefault();
    event.stopImmediatePropagation();
    if(el.dataset.vv2Node){
      selectNode(el.dataset.vv2Node);
      if(el.classList&&el.classList.contains('vv2-points')){
        const inspect=document.getElementById('vv2-inspector');
        if(inspect)inspect.scrollIntoView({block:'nearest',behavior:'smooth'});
      }
    }
    else if(el.dataset.vv2Action==='upgrade')upgrade();
    else if(el.dataset.vv2Action==='reset')resetMastery();
    else if(el.dataset.vv2Action==='select-mastery')selectNode('mastery');
    else if(el.dataset.vv2Action==='back-tree')selectNode('mastery');
  },true);
  render();
})();


/* v1.4.1 mobile navigation; desktop navigation remains unchanged */
(function(){
 const mobilePages=['Home','Gathering','Gacha','Characters'];
 const allPages=['Home','Gathering','Gacha','Characters','Skill Tree','Expeditions','Discoveries','Inventory','Missions','Legacy','Journal','Shop','Patch Notes','Update Game'];
 const icons={Home:'⌂',Gathering:'🪵',Gacha:'✧',Characters:'♙'};
 const bar=document.getElementById('vv-mobile-nav'),menu=document.getElementById('vv-mobile-more');
 if(!bar||!menu)return;
 bar.innerHTML=mobilePages.map(p=>'<button type="button" data-page="'+p+'"><span aria-hidden="true">'+icons[p]+'</span>'+p+'</button>').join('')+'<button type="button" id="vv-mobile-more-toggle" aria-controls="vv-mobile-more" aria-expanded="false"><span aria-hidden="true">☷</span>More</button>';
 menu.innerHTML=allPages.filter(p=>!mobilePages.includes(p)).map(p=>'<button type="button" data-page="'+p+'">'+p+'</button>').join('');
 function closeMenu(){menu.classList.remove('is-open');const toggle=document.getElementById('vv-mobile-more-toggle');if(toggle)toggle.setAttribute('aria-expanded','false')}
 function sync(){const active=typeof page==='string'?page:'Home';for(const b of bar.querySelectorAll('[data-page]')){const yes=b.dataset.page===active;b.classList.toggle('active',yes);if(yes)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')}for(const b of menu.querySelectorAll('[data-page]'))b.classList.toggle('active',b.dataset.page===active);const toggle=document.getElementById('vv-mobile-more-toggle');if(toggle)toggle.classList.toggle('active',!mobilePages.includes(active))}
 document.addEventListener('click',e=>{const toggle=e.target.closest('#vv-mobile-more-toggle');if(toggle){e.preventDefault();const open=menu.classList.toggle('is-open');toggle.setAttribute('aria-expanded',String(open));sync();return}const nav=e.target.closest('#vv-mobile-nav [data-page],#vv-mobile-more [data-page]');if(nav){closeMenu();requestAnimationFrame(sync);return}if(!e.target.closest('#vv-mobile-more'))closeMenu()},true);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
 const main=document.getElementById('main');if(main&&typeof MutationObserver!=='undefined'){new MutationObserver(sync).observe(main,{childList:true})}
 sync();
})();

</script></body></html>
