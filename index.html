const bar=(v,green=false)=>`<div class="bar"><div class="fill ${green?'green':''}" style="width:${Math.max(0,Math.min(100,v))}%"></div></div>`;const button=(label,action,disabled=false,alt=false)=>`<button class="btn ${alt?'alt':''}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
function home(){return `<div class="row companions-heading"><div><h2>✧ My Companions</h2><div class="muted small">Five moonlit companion slots · swipe to browse · Seraphine gathers automatically</div></div><span class="pill">✧ ${s.restored?'Moonwood Reborn':'Whispering Grove'}</span></div><div class="cards moonlit-cards"><div class="card ${flipped?'flipped':''}"><div class="inner"><div class="face ${s.awakened?'awakened':''}"><div class="portrait"></div><div class="portrait-shine"></div><div class="card-crest">✧</div><span class="pill" style="position:absolute;top:13px;left:12px;background:#67378d">EPIC ✦ ${s.awakened?'AWAKENED I':''}</span><div class="cardbody"><div class="character-subtitle">✦ FOREST WHISPERER ✦</div><h2 style="font-size:26px;margin:0">Seraphine</h2><div class="stat"><span>Character Lv. ${level(s.xp)}</span><span>${Math.floor(pct(s.xp))}%</span></div>${bar(pct(s.xp))}<div class="stat"><span>🌳 Woodcutting Lv. ${level(s.profXp)}</span><span>${Math.floor(pct(s.profXp))}%</span></div>${bar(pct(s.profXp),true)}<div class="stat"><span>Gathering automatically</span><span>${s.progress.toFixed(1)} / ${speed().toFixed(1)}s</span></div>${bar(s.progress/speed()*100,true)}<div style="margin-top:12px">${button('↻ Flip to skill tree','flip')}</div></div></div><div class="face back"><div class="row"><h3>✧ Woodcutting Tree</h3>${button('↶ Back','flip',false,true)}</div><p class="muted small">Classic branching skill tree · ${s.skill} points available</p><div class="tree">🌲 Forest Fundamentals<br><small>Gathering basics</small></div><div style="text-align:center">│<br>◆<br>╱ ╲</div><div class="twocol"><div class="tree">⚡ Swift Hands<br><small>Speed +6% / rank</small></div><div class="tree">🦋 Moon Sight<br><small>Discovery talents (future)</small></div></div><div style="text-align:center">╲ ╱<br>◆</div><div class="tree"><b>Forest Mastery</b><p>Rank ${s.skillSpent}/5</p>${button('Spend 1 skill point','skill',s.skill<1||s.skillSpent>=5)}</div><p class="muted small">Gain a point for each Woodcutting level. Skill effects persist.</p></div></div></div>${[5,15,30,50].map((n,i)=>`<div class="card"><div class="face locked rarity-${i}"><div class="locked-crown">✦</div><div class="symbol">♙</div><h3>Companion Slot ${i+2}</h3><p class="muted">${level(s.xp)>=n?'Slot milestone reached — assignment coming later':'Unlock milestone: Player Lv. '+n}</p><span class="pill">${level(s.xp)>=n?'◇ Available later':'🔒 Locked'}</span></div></div>`).join('')}</div><div class="home-bottom"><section class="panel"><h3>🌳 Idle Gathering</h3><p class="muted small">Seraphine gathers wood, XP, and occasional magical discoveries automatically—even when you're away (up to 8 hours).</p><p>Woodcutting efficiency: <b>+${Math.round((8/speed()-1)*100)}%</b></p></section><section class="panel"><h3>🌙 Your next legacy step</h3><p>${nextStep()}</p>${button('Open Moonwood Legacy','legacy')}</section><section class="panel"><h3>✧ Current Area</h3><div class="area-mini">Whispering Grove · The Moonlit Forest</div>${button('Explore Grove','expeditions')}</section></div>`}
function nextStep(){if(!s.shrineFound)return 'Explore the Whispering Grove and discover the Forgotten Moonwood.';if(!s.clue)return 'Explore the shrine to uncover the Moonwood restoration ritual.';if(!s.awakened)return 'Awaken Seraphine using 20 Wood, 8 Essence, and a Lunar Butterfly.';if(!s.restored)return 'Restore the Moonwood using 40 Wood and 12 Essence.';return 'The Moonwood has been reborn! Return to the Grove to see new expedition outcomes.'}
const events=[{title:'The Forking Path',desc:'Two trails shimmer beneath the violet canopy. One hums with ancient magic; the other is covered in silver leaves.',choices:[['Follow the ancient humming','shrine'],['Search the silver-leaf trail','wood']]},{title:'The Forgotten Moonwood',desc:'A dying silver tree towers above a ruined shrine. An inscription speaks of a companion who can awaken its heart.',choices:[['Study the inscription','clue'],['Gather fallen Moonwood','wood']]},{title:'A Lantern in the Moss',desc:'A little spirit offers to trade a secret for a moment of kindness.',choices:[['Help the spirit','essence'],['Ask about the old tree','hint']]},{title:'Crystal Butterfly Crossing',desc:'Luminous butterflies dance above a moonlit stream. A few settle close enough to observe.',choices:[['Study the butterflies','butterfly'],['Follow their flight','essence']]},{title:'The Rootbound Chest',desc:'A wooden chest rests beneath a gnarled root. Its carvings seem to react to Seraphine.',choices:[['Open it carefully','wood'],['Trace the glowing carvings','essence']]},{title:'Echoes of the Grove',desc:'The grove remembers your earlier choices. Familiar whispers guide you toward something new.',choices:[['Listen to the whispers','essence'],['Search for unusual bark','wood']]}];
function activeEvent(){
 if(!s.patch02)return events[encounter];
 if(!s.shrineFound)return {title:'The Forking Path',desc:'Seraphine senses two routes. The humming path leads to an ancient place; the silver-leaf path reveals the grove’s secrets.',choices:[['Follow the humming toward the forgotten shrine','findshrine'],['Study the silver leaves for a hidden trail','findtrail']]};
 if(!s.clue)return {title:'The Ancient Inscription',desc:'At the dying tree, tangled roots cover an inscription. A careful hand or a trusted spirit could reveal it.',choices:[['Carefully clear the roots (8 Wood)','clearroots'],['Ask the lantern spirit for guidance','askspirit']]};
 if(!s.spiritHelped)return {title:'A Lantern in the Moss',desc:'A small spirit is trapped under thorny vines. It offers no reward, but watches Seraphine with hope.',choices:[['Free the spirit (5 Wood)','helpspirit'],['Leave it safe and follow the moonlit stream','stream']]};
 if(!s.rootSeal)return {title:'The Sealed Roots',desc:'The ancient roots are bound by moonlight. Seraphine can open a quiet passage using her Woodcutting skill, or gather clues from the stream.',choices:[['Unseal the hidden route (Woodcutting Lv. 2)','unseal'],['Search the stream for moon essence','stream']]};
 return {title:s.restored?'The Grove Remembers':'A Choice Beneath the Boughs',desc:s.restored?'The restored grove responds to the paths and friendships you made.':'Your previous decisions have opened new paths through the forest.',choices:[['Visit the '+(s.moonPath?'Silverleaf':'Moonlit')+' trail','trailreward'],['Meet the '+(s.spiritHelped?'grateful lantern spirit':'forest echoes'),'spiritreward']]};
}
function expeditions(){let e=activeEvent();return `<div class="row"><div><h2>✧ Endless Expeditions</h2><div class="muted small">No stamina · no combat · ${s.patch02?'Patch 02: persistent choices and alternate paths':'Classic expedition encounters'}</div></div><span class="pill">Explorations: ${s.expeditions}</span></div><div class="scene ${s.restored?'restored':''}"><div><span class="tag">Whispering Grove</span><h2>${s.restored?'The Grove Remembers':'Moonlit Forest'}</h2></div></div><div class="twocol"><section class="panel"><span class="tag">Current encounter</span><h3 style="font-size:25px;margin-top:9px">${e.title}</h3><p class="muted">${e.desc}</p>${e.choices.map((c,i)=>`<div class="path"><div class="row"><span>${c[0]}</span>${button('Choose','choose'+i,!!(s.patch02&&((c[1]==='clearroots'&&s.wood<8)||(c[1]==='helpspirit'&&s.wood<5)||(c[1]==='unseal'&&level(s.profXp)<2))))}</div></div>`).join('')}<p class="muted small">${s.patch02?'Decisions permanently change your routes, allies, and later encounters.':'Install Patch 02 from Patch Notes to unlock branching consequences.'}</p></section><section class="panel"><h3>✦ Expedition Journal</h3>${s.patch02?`<p class="muted small">Silverleaf trail: ${s.moonPath?'Found':'Hidden'} · Lantern spirit: ${s.spiritHelped?'Friend':'Unknown'} · Root passage: ${s.rootSeal?'Open':'Sealed'}</p>`:''}<div class="log">${s.log.length?s.log.slice(0,12).map(x=>`<p>${x}</p>`).join(''):'<p>No discoveries yet. Your first expedition awaits.</p>'}</div></section></div>`}
function resolveChoice(i){const e=activeEvent(),type=e.choices[i][1];if(!s.patch02){const legacyType=type;s.expeditions++;let msg='';if(legacyType==='shrine'){s.shrineFound=true;msg='You discovered the Forgotten Moonwood!';note('🌙 Forgotten Moonwood discovered')}else if(legacyType==='clue'){s.shrineFound=true;s.clue=true;msg='Restoration ritual learned!';note('📜 Restoration ritual learned')}else if(legacyType==='butterfly'){s.butterfly++;s.discoveryCount++;msg='Lunar Butterfly discovered!';note('🦋 Lunar Butterfly found')}else if(legacyType==='essence'){s.essence+=3;msg='+3 Moon Essence';note('✧ Expedition reward: +3 Essence')}else if(legacyType==='wood'){s.wood+=8;msg='+8 Wood';note('🪵 Expedition reward: +8 Wood')}else{s.essence++;msg='+1 Essence';note('🌿 A forest spirit shared a secret')}encounter=s.shrineFound&&!s.clue?1:(s.expeditions%6===0?0:2+(s.expeditions%4));toast(msg);return}
 let msg='';if(type==='findshrine'){s.shrineFound=true;s.routeChoice='Humming Path';msg='The Forgotten Moonwood is revealed!'}
 else if(type==='findtrail'){s.shrineFound=true;s.moonPath=true;s.routeChoice='Silverleaf Trail';s.butterfly++;s.discoveryCount++;msg='Silverleaf Trail discovered! +1 Lunar Butterfly'}
 else if(type==='clearroots'){if(s.wood<8)return;s.wood-=8;s.clue=true;msg='The restoration ritual is deciphered.'}
 else if(type==='askspirit'){s.clue=true;s.spiritTrust++;msg='The lantern spirit reveals the ritual and remembers your trust.'}
 else if(type==='helpspirit'){if(s.wood<5)return;s.wood-=5;s.spiritHelped=true;s.spiritTrust+=2;s.essence+=3;msg='The spirit becomes your ally. +3 Essence'}
 else if(type==='stream'){s.essence+=4;s.discoveryCount++;msg='You find +4 Moon Essence beside the stream.';if(!s.spiritHelped){s.spiritHelped=true;s.spiritTrust++;msg+=' The lantern spirit follows you.'}}
 else if(type==='unseal'){if(level(s.profXp)<2)return;s.rootSeal=true;s.essence+=5;msg='Seraphine opens the hidden root passage! +5 Essence'}
 else if(type==='trailreward'){s.wood+=s.moonPath?12:7;s.essence+=s.rootSeal?3:1;msg='A familiar path yields wood and Moon Essence.'}
 else if(type==='spiritreward'){s.essence+=s.spiritHelped?5:2;if(s.spiritTrust>=2){s.butterfly++;s.discoveryCount++;msg='Your spirit ally brings a Lunar Butterfly and Moon Essence!'}else msg='Forest echoes grant Moon Essence.'}
 s.expeditions++;note('✧ '+msg);toast(msg);
}
function discoveries(){return `<h2>🦋 Magical Discoveries</h2><p class="muted">Gathering and expeditions can reveal rare materials and story clues. All discoveries remain in your Journal.</p><div class="discovery-hero"><img src="assets/lunar_discovery.webp" alt="Glowing lunar butterfly in an enchanted forest"><div><span class="tag">✧ A MAGICAL DISCOVERY ✧</span><h2>Lunar Butterfly</h2><p>A rare spirit shimmers between the violet blossoms. Discoveries become part of your Moonwood legacy.</p></div></div><div class="grid"><div class="panel"><h3>🦋 Lunar Butterfly</h3><h2>${s.butterfly}</h2><p class="muted small">Found occasionally through Woodcutting or by exploring butterfly crossings. Required for Awakening I.</p></div><div class="panel"><h3>✧ Moon Essence</h3><h2>${s.essence}</h2><p class="muted small">Gathered slowly or earned through expedition decisions.</p></div><div class="panel"><h3>🌙 Recorded discoveries</h3><h2>${s.discoveryCount}</h2><p class="muted small">Moonlit bark, butterflies, and other unusual findings.</p></div></div><section class="panel"><h3>Discovery History</h3><div class="log">${s.log.filter(x=>/discover|butterfly|Moonlit|Butterfly/i.test(x)).map(x=>`<p>${x}</p>`).join('')||'<p class="muted">No magical discoveries recorded yet.</p>'}</div></section>`}
function legacy(){let canAwaken=s.clue&&s.wood>=20&&s.essence>=8&&s.butterfly>=1;let canRestore=s.awakened&&s.wood>=40&&s.essence>=12;return `<div class="row"><div><h2>🌙 The Vioverse Legacy</h2><p class="muted small">A permanent story of Seraphine and the Ancient Moonwood Tree</p></div><span class="pill">${s.restored?'✦ Legacy Complete':'Legacy in Progress'}</span></div><div class="scene ${s.restored?'restored':''}"><div><span class="tag">${s.restored?'A living world':'A forgotten world'}</span><h2>${s.restored?'Moonwood Reborn':'The Ancient Moonwood'}</h2></div></div><div class="grid"><div class="panel"><h3>1. Discover the Ancient Tree ${s.shrineFound?'✓':''}</h3><p class="muted small">Find the Forgotten Moonwood during an expedition.</p><span class="pill">${s.shrineFound?'Completed':'Not discovered'}</span></div><div class="panel"><h3>2. Learn the Ritual ${s.clue?'✓':''}</h3><p class="muted small">Investigate the tree's inscription in the Grove.</p><span class="pill">${s.clue?'Completed':'Requires discovery'}</span></div><div class="panel"><h3>3. Seraphine — Awakening I ${s.awakened?'✓':''}</h3><p class="muted small">Requires 20 Wood · 8 Essence · 1 Lunar Butterfly. Unlocks +15% gathering efficiency, extra wood, and a radiant card border.</p>${s.awakened?'<span class="pill">✦ Awakened</span>':button('Awaken Seraphine','awaken',!canAwaken)}</div><div class="panel"><h3>4. Restore the Moonwood ${s.restored?'✓':''}</h3><p class="muted small">Requires Awakening I, 40 Wood, and 12 Essence. Permanently transforms the Grove and grants +10% gathering efficiency.</p>${s.restored?'<span class="pill">🌸 Moonwood Reborn</span>':button('Restore the Ancient Tree','restore',!canRestore)}</div></div><div class="notice">${nextStep()}</div>${button('Explore the Whispering Grove','expeditions',false,true)}</div>`}
const PATCHES=[
 {name:'Patch 01 · Gathering Reliability',version:'v0.3',status:'Implemented',summary:'Gathering, XP, leveling, and offline simulation improvements.',details:[

 ]},
 {name:'Patch 02 · Meaningful Expeditions',version:'v0.4',status:'Available to apply',summary:'Make expedition decisions change routes, story flags, and future outcomes.',details:[

 ]},
 {name:'Patch 04 · Awakening Clarity',version:'Planned',status:'Not implemented',summary:'Improve Awakening requirements, progress, and bonuses.',details:[

function patchNotes(){const p=PATCHES[patchIndex];const status=patchIndex===1&&s.patch02?'Applied':p.status;return `<div class="row"><div><h2>📜 Patch Notes</h2><p class="muted small">Vioverse development roadmap · see what is implemented and what is planned</p></div><span class="pill">${p.version} · ${status}</span></div><section class="panel"><div class="row"><h3 style="font-size:25px">${p.name}</h3><span class="pill">${status}</span></div><p class="muted">${p.summary}</p>${p.details.map(x=>`<p>✦ ${x}</p>`).join('')}<div class="row" style="margin-top:22px">${button('← Previous Patch','prevpatch',patchIndex===0,true)}${button(patchIndex===PATCHES.length-1?'Back to Patch 01':'Next Patch →','nextpatch',false)}${patchIndex===1?button(s.patch02?'✓ Patch 02 Applied':'✦ Apply Patch 02 Now','applypatch02',s.patch02):''}</div><p class="muted small">Next Patch moves to the next patch. Apply Patch 02 Now activates the bundled expedition improvements and saves the change. Future patches require new game builds.</p></section><section class="panel"><h3>Development progress</h3><p>✓ Patch 01 — Gathering reliability</p><p class="muted">${s.patch02?'✓ Patch 02 — Expeditions applied':'○ Patch 02 — Ready to apply'} · ○ Patch 03 — Inventory · ○ Patch 04 — Awakening</p></section>`}

const BUILD_VERSION='0.8.0', BUILD_ID='2026-10-25-v08-auto-update';
let updateInfo={state:'idle',manifest:null,message:'Automatic checks every 5 seconds while online. The game only reloads when a newer published build is ready.'};
function compareVersions(a,b){const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)?1:-1}return 0}
function updateScreen(){let u=updateInfo,remote=u.manifest;return `<div class="row"><div><h2>↻ Update Game</h2><p class="muted small">Updates are downloaded from this website after a new version is published.</p></div><span class="pill">Installed v${BUILD_VERSION}</span></div><section class="panel"><h3>Game updater</h3><p class="muted">${u.message}</p>${remote&&u.state==='available'?`<div class="panel"><h3>v${remote.version} — ${escapeText(remote.title||'New update')}</h3><p>${escapeText(remote.notes||'A new version is available.')}</p></div>`:''}<div class="row">${button(u.state==='checking'?'Checking…':'↻ Check for Updates','checkupdate',u.state==='checking')}${u.state==='available'?button('⬇ Update Game Now','installupdate',false):''}</div><p class="muted small">Your progress stays in this browser's local storage. Do not clear website data or switch website addresses if you want to keep your save. New releases must first be uploaded to GitHub and deployed by GitHub Pages.</p></section>`}
function escapeText(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function checkGameUpdate(silent=false){if(updateCheckBusy)return;updateCheckBusy=true;if(!silent){updateInfo={...updateInfo,state:'checking',message:'Checking the published version…'};render()}try{if(location.protocol==='file:')throw Error('Online updates require the hosted GitHub Pages website, not a local HTML file.');const url=new URL('version.json',location.href);url.searchParams.set('check',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('version.json is not published yet (HTTP '+response.status+').');const data=await response.json();if(!/^\d+\.\d+\.\d+$/.test(data.version)||typeof data.build!=='string')throw Error('Invalid version.json format.');const newer=compareVersions(data.version,BUILD_VERSION)>0 || (compareVersions(data.version,BUILD_VERSION)===0&&data.build!==BUILD_ID);updateInfo={state:newer?'available':'current',manifest:data,message:newer?'New update detected: v'+data.version+'. Automatic installation is queued.':'You are running the latest published version (v'+BUILD_VERSION+').'};if(newer)queueAutoUpdate();}catch(err){if(!silent)updateInfo={state:'error',manifest:null,message:'Could not check for updates: '+err.message}}finally{updateCheckBusy=false}if(!silent||page==='Update Game')render()}
let updateCheckBusy=false,autoUpdatePending=false,autoUpdateTimer=null;
function queueAutoUpdate(){if(autoUpdatePending)return;autoUpdatePending=true;toast('✧ New Vioverse patch found! Saving and updating soon…');autoUpdateTimer=setTimeout(tryAutoUpdate,1200)}
function tryAutoUpdate(){if(!autoUpdatePending||updateInfo.state!=='available')return;
 // Avoid interrupting an expedition decision; the next page change completes the update.
 if(page==='Expeditions'){return}
 autoUpdatePending=false;installGameUpdate()}
function installGameUpdate(){if(updateInfo.state!=='available'||!updateInfo.manifest)return;save();const dest=new URL(location.href);dest.searchParams.set('v',updateInfo.manifest.build);location.replace(dest.toString())}

function render(){const sc=document.querySelector('.cards');if(sc)scrollPos=sc.scrollLeft;document.getElementById('nav').innerHTML=['Home','Expeditions','Discoveries','Legacy','Patch Notes','Update Game'].map(n=>`<button data-page="${n}" class="${page===n?'active':''}">${({Home:'⌂',Expeditions:'✧',Discoveries:'🦋',Legacy:'☾','Patch Notes':'▤','Update Game':'↻'})[n]} &nbsp;${n}</button>`).join('');document.getElementById('main').innerHTML=({Home:home,Expeditions:expeditions,Discoveries:discoveries,Legacy:legacy,'Patch Notes':patchNotes,'Update Game':updateScreen})[page]();document.getElementById('wood').textContent=fmt(s.wood);document.getElementById('essence').textContent=fmt(s.essence);document.getElementById('butterfly').textContent=fmt(s.butterfly);document.getElementById('level').textContent=level(s.xp);if(page==='Home'&&document.querySelector('.cards'))document.querySelector('.cards').scrollLeft=scrollPos}
document.addEventListener('click',e=>{const t=e.target.closest('[data-page],[data-action]');if(!t)return;if(t.dataset.page){page=t.dataset.page;flipped=false}else{const a=t.dataset.action;if(a==='checkupdate'){checkGameUpdate();return}else if(a==='installupdate'){installGameUpdate();return}else if(a==='nextpatch'){patchIndex=(patchIndex+1)%PATCHES.length;if(patchIndex===1&&!s.patch02){s.patch02=true;note('📜 Patch 02 installed: meaningful expedition branches unlocked');toast('Patch 02 applied! New expedition paths are live.')}}else if(a==='applypatch02'){if(!s.patch02){s.patch02=true;note('📜 Patch 02 installed: meaningful expedition branches unlocked');toast('Patch 02 applied! Explore the Grove.')}}else if(a==='prevpatch'){patchIndex=Math.max(0,patchIndex-1)}else if(a==='flip')flipped=!flipped;else if(a==='legacy'||a==='expeditions')page=a==='legacy'?'Legacy':'Expeditions';else if(a==='skill'&&s.skill>0&&s.skillSpent<5){s.skillSpent++;s.skill--;toast('Forest Mastery improved!')}else if(a.startsWith('choose'))resolveChoice(+a.slice(6));else if(a==='awaken'&&s.clue&&s.wood>=20&&s.essence>=8&&s.butterfly>=1&&!s.awakened){s.wood-=20;s.essence-=8;s.butterfly--;s.awakened=true;note('✦ Seraphine reached Awakening I!');toast('Seraphine Awakened! Her card has transformed.')}else if(a==='restore'&&s.awakened&&s.wood>=40&&s.essence>=12&&!s.restored){s.wood-=40;s.essence-=12;s.restored=true;note('🌸 MOONWOOD REBORN — the Grove will remember forever');toast('The Ancient Moonwood has been restored!')}}save();render();if(autoUpdatePending&&page!=='Expeditions')tryAutoUpdate()});
const away=Math.max(0,Math.min((Date.now()-s.last)/1000,28800));if(away>10){const before=s.cycles;advance(away);note('⏳ Offline gathering: '+(s.cycles-before)+' cycles completed');setTimeout(()=>toast('Welcome back! '+(s.cycles-before)+' gathering cycles completed.'),500)}save();render();let prev=Date.now();setInterval(()=>{const now=Date.now();advance((now-prev)/1000);prev=now;save();if(page==='Home'||page==='Discoveries'||page==='Legacy')render();else{document.getElementById('wood').textContent=fmt(s.wood);document.getElementById('essence').textContent=fmt(s.essence);document.getElementById('butterfly').textContent=fmt(s.butterfly);document.getElementById('level').textContent=level(s.xp)}},1000);if(location.protocol!=='file:'){setTimeout(()=>checkGameUpdate(true),1500);setInterval(()=>{if(document.visibilityState==='visible')checkGameUpdate(true)},5000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkGameUpdate(true)})}
</script></body></html>
