<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vioverse — Moonwood Legacy v0.4</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,Arial;color:#f2e8ff;background:#0c0917}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(100deg,#0b0819f2,#140d27d9),url('assets/world.webp') center/cover fixed}button{font:inherit;cursor:pointer;color:inherit}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:2px solid #e5b6ff}header{padding:15px 25px;background:#110d20e8;border-bottom:1px solid #765291;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1,h2,h3{font-family:Georgia,serif}h1{font-size:27px;letter-spacing:2px;margin:0;color:#eed8ff}h2{font-size:31px;margin:0 0 7px}h3{margin:0 0 10px}.muted,small{color:#baa8ce}.small{font-size:13px}.curr{display:flex;gap:9px;flex-wrap:wrap}.pill{border:1px solid #6b4b8b;background:#2a1d3e;padding:8px 12px;border-radius:99px;font-size:13px}.shell{display:grid;grid-template-columns:182px minmax(0,1fr);min-height:calc(100vh - 120px)}nav{padding:15px 10px;background:#110d20dc;border-right:1px solid #50356b}nav button{display:block;width:100%;text-align:left;padding:13px;border:1px solid transparent;background:none;border-radius:10px;margin-bottom:4px;color:#c9b6de}nav button.active,nav button:hover{background:#402854;border-color:#855aa9;color:white}main{padding:25px;max-width:1500px;width:100%;margin:auto}.panel{border:1px solid #765392;background:#1c142eea;border-radius:17px;padding:19px;box-shadow:0 14px 30px #0003;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:1px solid #c093e7;background:linear-gradient(#8c5ab6,#613985);border-radius:10px;padding:11px 15px;font-weight:600}.btn:hover:not(:disabled){filter:brightness(1.18)}.btn.alt{background:#322443;border-color:#75568d}.btn.gold{background:linear-gradient(#b68c4b,#6e4c29);border-color:#e8c785}.bar{height:10px;border-radius:99px;overflow:hidden;background:#100b1b;border:1px solid #50375e;margin:8px 0}.fill{height:100%;background:linear-gradient(90deg,#7a4bb3,#d3a0ff);transition:width .3s}.fill.green{background:linear-gradient(90deg,#288b5c,#8ae8b5)}.tag{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#e5c4ff}.cards{display:flex;gap:16px;overflow-x:auto;padding:10px 6px 20px;scroll-snap-type:x mandatory}.card{position:relative;flex:0 0 290px;height:620px;scroll-snap-align:start;perspective:1200px}.inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .65s}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #b78eea;border-radius:18px;overflow:hidden;background:linear-gradient(#35234a,#150f24);box-shadow:0 0 0 4px #24152e,0 0 26px #a16ee44d}.face.back{transform:rotateY(180deg);padding:17px;overflow:auto}.portrait{height:59%;background:linear-gradient(0deg,#1b1227,transparent 32%),url('assets/seraphine.webp') center 28%/cover}.face.awakened{border-color:#e8c18b;box-shadow:0 0 0 4px #4e3057,0 0 35px #f2b5ff88}.cardbody{padding:12px 15px}.locked{display:grid;place-content:center;text-align:center;padding:18px;background:linear-gradient(#29203dd9,#120d20e9),url('assets/world.webp') center/cover}.locked .symbol{font-size:60px;color:#9c7fb8}.stat{font-size:12px;display:flex;justify-content:space-between}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tree{padding:13px;background:#302040;border:1px solid #8666a7;border-radius:12px;text-align:center;margin:10px 0}.path{border:1px solid #70518b;border-radius:13px;background:#291d3d;padding:14px;margin:12px 0}.path.selected{border-color:#e6c287;background:#40304a}.scene{height:260px;border-radius:14px;background:linear-gradient(0deg,#160d29f5,transparent 70%),url('assets/world.webp') center/cover;display:flex;align-items:end;padding:22px;border:1px solid #6e528d}.scene.restored{background:radial-gradient(circle at 58% 28%,#ddbcff65,transparent 45%),linear-gradient(0deg,#190e29df,transparent 70%),url('assets/world.webp') center/cover;border-color:#d8b57f;box-shadow:inset 0 0 80px #dcb0ff44}.scene h2{font-size:30px;text-shadow:0 3px 12px #000}.notice{background:#332344;border-left:3px solid #cba2e8;padding:12px;border-radius:8px;margin:12px 0}.log{max-height:200px;overflow:auto;font-size:13px}.log p{margin:7px 0;border-bottom:1px solid #3b2a4c;padding-bottom:7px}.toast{position:fixed;right:16px;bottom:16px;z-index:5;padding:15px;background:#44285c;border:1px solid #d4a6ff;border-radius:12px;max-width:350px;box-shadow:0 10px 30px #0009}.foot{text-align:center;color:#a899b8;font-size:12px;padding:14px}@media(max-width:780px){.shell{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;gap:5px;padding:7px}nav button{white-space:nowrap;width:auto;margin:0;padding:9px}main{padding:14px}.twocol{grid-template-columns:1fr}.card{flex-basis:270px;height:610px}header{padding:12px}}
</style></head><body><header><div><h1>✧ VIOVERSE</h1><small>Moonwood Legacy · v0.4 · Patch 02 ready</small></div><div class="curr"><span class="pill">🪵 <b id="wood">0</b></span><span class="pill">✧ <b id="essence">0</b> Essence</span><span class="pill">🦋 <b id="butterfly">0</b></span><span class="pill">✦ Lv. <b id="level">1</b></span></div></header><div class="shell"><nav id="nav"></nav><main id="main"></main></div><div class="foot">Progress is saved locally in this browser. Illustrative game balance · no combat, no stamina.</div><div id="toast" class="toast" hidden></div><script>
'use strict';
const KEY='moonveil_legacy_v02';const initial=()=>({wood:0,essence:0,butterfly:0,xp:0,profXp:0,cycles:0,progress:0,awakened:false,restored:false,shrineFound:false,clue:false,branch:0,expeditions:0,discoveryCount:0,log:[],last:Date.now(),skill:0,skillSpent:0,patch02:false,spiritHelped:false,spiritTrust:0,moonPath:false,rootSeal:false,routeChoice:"",encounterStep:0});let s;try{s={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{s=initial()};if(!Array.isArray(s.log))s.log=[];
let page='Home',flipped=false,encounter=0,selected=-1,scrollPos=0,patchIndex=0;const level=x=>1+Math.floor(Math.sqrt(x/45));const pct=x=>{const a=Math.floor(Math.sqrt(x/45));return Math.min(100,(x-45*a*a)/(45*(2*a+1))*100)};const fmt=x=>Math.floor(x).toLocaleString();const speed=()=>8/(1+.35+s.skillSpent*.06+(s.awakened?.15:0)+(s.restored?.1:0));
function note(t){s.log.unshift(t);s.log=s.log.slice(0,35)}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>e.hidden=true,3700)}function save(){s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}}function advance(dt){
 // Simulate only elapsed time, capped to 8 hours for offline progress.
 // Use event-driven cycle stepping; never lose progress after 6000 iterations.
 let d=Math.max(0,Math.min(Number(dt)||0,28800));
 let cycles=0, discoveries=0, butterflies=0;
 while(d>0){
  const duration=speed();
  const remaining=Math.max(0.000001,duration-s.progress);
  if(d<remaining){s.progress+=d;break}
  d-=remaining;s.progress=0;cycles++;
  s.cycles++;s.wood+=3+(s.awakened?1:0);s.xp+=3;s.profXp+=10;
  if(s.cycles%9===0)s.essence+=1;
  if(s.cycles%18===0){s.discoveryCount++;s.essence+=3;discoveries++}
  if(s.cycles%38===0){s.butterfly++;butterflies++}
 }
 if(discoveries)note('✧ Magical Discovery: Moonlit Bark ×'+discoveries+' (+'+(discoveries*3)+' Essence)');
 if(butterflies)note('🦋 Rare Discovery: Lunar Butterfly ×'+butterflies);
 s.skill=Math.max(0,level(s.profXp)-1-s.skillSpent);
 return cycles;
}
const bar=(v,green=false)=>`<div class="bar"><div class="fill ${green?'green':''}" style="width:${Math.max(0,Math.min(100,v))}%"></div></div>`;const button=(label,action,disabled=false,alt=false)=>`<button class="btn ${alt?'alt':''}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
function home(){return `<div class="row"><div><h2>My Companions</h2><div class="muted small">One active companion · five planned slots · swipe to browse</div></div><span class="pill">✧ ${s.restored?'Moonwood Reborn':'Whispering Grove'}</span></div><div class="cards"><div class="card ${flipped?'flipped':''}"><div class="inner"><div class="face ${s.awakened?'awakened':''}"><div class="portrait"></div><span class="pill" style="position:absolute;top:13px;left:12px;background:#67378d">EPIC ✦ ${s.awakened?'AWAKENED I':''}</span><div class="cardbody"><h2 style="font-size:26px;margin:0">Seraphine</h2><div class="stat"><span>Character Lv. ${level(s.xp)}</span><span>${Math.floor(pct(s.xp))}%</span></div>${bar(pct(s.xp))}<div class="stat"><span>🌳 Woodcutting Lv. ${level(s.profXp)}</span><span>${Math.floor(pct(s.profXp))}%</span></div>${bar(pct(s.profXp),true)}<div class="stat"><span>Gathering automatically</span><span>${s.progress.toFixed(1)} / ${speed().toFixed(1)}s</span></div>${bar(s.progress/speed()*100,true)}<div style="margin-top:12px">${button('↻ Flip to skill tree','flip')}</div></div></div><div class="face back"><div class="row"><h3>✧ Woodcutting Tree</h3>${button('↶ Back','flip',false,true)}</div><p class="muted small">Classic branching skill tree · ${s.skill} points available</p><div class="tree">🌲 Forest Fundamentals<br><small>Gathering basics</small></div><div style="text-align:center">│<br>◆<br>╱ ╲</div><div class="twocol"><div class="tree">⚡ Swift Hands<br><small>Speed +6% / rank</small></div><div class="tree">🦋 Moon Sight<br><small>Discovery talents (future)</small></div></div><div style="text-align:center">╲ ╱<br>◆</div><div class="tree"><b>Forest Mastery</b><p>Rank ${s.skillSpent}/5</p>${button('Spend 1 skill point','skill',s.skill<1||s.skillSpent>=5)}</div><p class="muted small">Gain a point for each Woodcutting level. Skill effects persist.</p></div></div></div>${[5,15,30,50].map((n,i)=>`<div class="card"><div class="face locked"><div class="symbol">♙</div><h3>Companion Slot ${i+2}</h3><p class="muted">${level(s.xp)>=n?'Slot milestone reached — assignment coming later':'Unlock milestone: Player Lv. '+n}</p><span class="pill">${level(s.xp)>=n?'◇ Available later':'🔒 Locked'}</span></div></div>`).join('')}</div><div class="grid"><section class="panel"><h3>🌳 Idle Gathering</h3><p class="muted small">Seraphine gathers wood, XP, and occasional magical discoveries automatically—even when you're away (up to 8 hours).</p><p>Woodcutting efficiency: <b>+${Math.round((8/speed()-1)*100)}%</b></p></section><section class="panel"><h3>🌙 Your next legacy step</h3><p>${nextStep()}</p>${button('Open Moonwood Legacy','legacy')}</section></div>`}
function nextStep(){if(!s.shrineFound)return 'Explore the Whispering Grove and discover the Forgotten Moonwood.';if(!s.clue)return 'Explore the shrine to uncover the Moonwood restoration ritual.';if(!s.awakened)return 'Awaken Seraphine using 20 Wood, 8 Essence, and a Lunar Butterfly.';if(!s.restored)return 'Restore the Moonwood using 40 Wood and 12 Essence.';return 'The Moonwood has been reborn! Return to the Grove to see new expedition outcomes.'}
const events=[{title:'The Forking Path',desc:'Two trails shimmer beneath the violet canopy. One hums with ancient magic; the other is covered in silver leaves.',choices:[['Follow the ancient humming','shrine'],['Search the silver-leaf trail','wood']]},{title:'The Forgotten Moonwood',desc:'A dying silver tree towers above a ruined shrine. An inscription speaks of a companion who can awaken its heart.',choices:[['Study the inscription','clue'],['Gather fallen Moonwood','wood']]},{title:'A Lantern in the Moss',desc:'A little spirit offers to trade a secret for a moment of kindness.',choices:[['Help the spirit','essence'],['Ask about the old tree','hint']]},{title:'Crystal Butterfly Crossing',desc:'Luminous butterflies dance above a moonlit stream. A few settle close enough to observe.',choices:[['Study the butterflies','butterfly'],['Follow their flight','essence']]},{title:'The Rootbound Chest',desc:'A wooden chest rests beneath a gnarled root. Its carvings seem to react to Seraphine.',choices:[['Open it carefully','wood'],['Trace the glowing carvings','essence']]},{title:'Echoes of the Grove',desc:'The grove remembers your earlier choices. Familiar whispers guide you toward something new.',choices:[['Listen to the whispers','essence'],['Search for unusual bark','wood']]}];
function activeEvent(){
 if(!s.patch02)return events[encounter];
 if(!s.shrineFound)return {title:'The Forking Path',desc:'Seraphine senses two routes. The humming path leads to an ancient place; the silver-leaf path reveals the grove’s secrets.',choices:[['Follow the humming toward the forgotten shrine','findshrine'],['Study the silver leaves for a hidden trail','findtrail']]};
 if(!s.clue)return {title:'The Ancient Inscription',desc:'At the dying tree, tangled roots cover an inscription. A careful hand or a trusted spirit could reveal it.',choices:[['Carefully clear the roots (8 Wood)','clearroots'],['Ask the lantern spirit for guidance','askspirit']]};
 if(!s.spiritHelped)return {title:'A Lantern in the Moss',desc:'A small spirit is trapped under thorny vines. It offers no reward, but watches Seraphine with hope.',choices:[['Free the spirit (5 Wood)','helpspirit'],['Leave it safe and follow the moonlit stream','stream']]};
 if(!s.rootSeal)return {title:'The Sealed Roots',desc:'The ancient roots are bound by moonlight. Seraphine can open a quiet passage using her Woodcutting skill, or gather clues from the stream.',choices:[['Unseal the hidden route (Woodcutting Lv. 2)','unseal'],['Search the stream for moon essence','stream']]};
 return {title:s.restored?'The Grove Remembers':'A Choice Beneath the Boughs',desc:s.restored?'The restored grove responds to the paths and friendships you made.':'Your previous decisions have opened new paths through the forest.',choices:[['Visit the '+(s.moonPath?'Silverleaf':'Moonlit')+' trail','trailreward'],['Meet the '+(s.spiritHelped?'grateful lantern spirit':'forest echoes'),'spiritreward']]};
}
function expeditions(){let e=activeEvent();return `<div class="row"><div><h2>✧ Endless Expeditions</h2><div class="muted small">No stamina · no combat · ${s.patch02?'Patch 02: persistent choices and alternate paths':'Classic expedition encounters'}</div></div><span class="pill">Explorations: ${s.expeditions}</span></div><div class="scene ${s.restored?'restored':''}"><div><span class="tag">Whispering Grove</span><h2>${s.restored?'The Grove Remembers':'Moonlit Forest'}</h2></div></div><div class="twocol"><section class="panel"><span class="tag">Current encounter</span><h3 style="font-size:25px;margin-top:9px">${e.title}</h3><p class="muted">${e.desc}</p>${e.choices.map((c,i)=>`<div class="path"><div class="row"><span>${c[0]}</span>${button('Choose','choose'+i,!!(s.patch02&&((c[1]==='clearroots'&&s.wood<8)||(c[1]==='helpspirit'&&s.wood<5)||(c[1]==='unseal'&&level(s.profXp)<2))))}</div></div>`).join('')}<p class="muted small">${s.patch02?'Decisions permanently change your routes, allies, and later encounters.':'Install Patch 02 from Patch Notes to unlock branching consequences.'}</p></section><section class="panel"><h3>✦ Expedition Journal</h3>${s.patch02?`<p class="muted small">Silverleaf trail: ${s.moonPath?'Found':'Hidden'} · Lantern spirit: ${s.spiritHelped?'Friend':'Unknown'} · Root passage: ${s.rootSeal?'Open':'Sealed'}</p>`:''}<div class="log">${s.log.length?s.log.slice(0,12).map(x=>`<p>${x}</p>`).join(''):'<p>No discoveries yet. Your first expedition awaits.</p>'}</div></section></div>`}
function resolveChoice(i){const e=activeEvent(),type=e.choices[i][1];if(!s.patch02){const legacyType=type;s.expeditions++;let msg='';if(legacyType==='shrine'){s.shrineFound=true;msg='You discovered the Forgotten Moonwood!';note('🌙 Forgotten Moonwood discovered')}else if(legacyType==='clue'){s.shrineFound=true;s.clue=true;msg='Restoration ritual learned!';note('📜 Restoration ritual learned')}else if(legacyType==='butterfly'){s.butterfly++;s.discoveryCount++;msg='Lunar Butterfly discovered!';note('🦋 Lunar Butterfly found')}else if(legacyType==='essence'){s.essence+=3;msg='+3 Moon Essence';note('✧ Expedition reward: +3 Essence')}else if(legacyType==='wood'){s.wood+=8;msg='+8 Wood';note('🪵 Expedition reward: +8 Wood')}else{s.essence++;msg='+1 Essence';note('🌿 A forest spirit shared a secret')}encounter=s.shrineFound&&!s.clue?1:(s.expeditions%6===0?0:2+(s.expeditions%4));toast(msg);return}
 let msg='';if(type==='findshrine'){s.shrineFound=true;s.routeChoice='Humming Path';msg='The Forgotten Moonwood is revealed!'}
 else if(type==='findtrail'){s.shrineFound=true;s.moonPath=true;s.routeChoice='Silverleaf Trail';s.butterfly++;s.discoveryCount++;msg='Silverleaf Trail discovered! +1 Lunar Butterfly'}
 else if(type==='clearroots'){if(s.wood<8)return;s.wood-=8;s.clue=true;msg='The restoration ritual is deciphered.'}
 else if(type==='askspirit'){s.clue=true;s.spiritTrust++;msg='The lantern spirit reveals the ritual and remembers your trust.'}
 else if(type==='helpspirit'){if(s.wood<5)return;s.wood-=5;s.spiritHelped=true;s.spiritTrust+=2;s.essence+=3;msg='The spirit becomes your ally. +3 Essence'}
 else if(type==='stream'){s.essence+=4;s.discoveryCount++;msg='You find +4 Moon Essence beside the stream.';if(!s.spiritHelped){s.spiritHelped=true;s.spiritTrust++;msg+=' The lantern spirit follows you.'}}
 else if(type==='unseal'){if(level(s.profXp)<2)return;s.rootSeal=true;s.essence+=5;msg='Seraphine opens the hidden root passage! +5 Essence'}
 else if(type==='trailreward'){s.wood+=s.moonPath?12:7;s.essence+=s.rootSeal?3:1;msg='A familiar path yields wood and Moon Essence.'}
 else if(type==='spiritreward'){s.essence+=s.spiritHelped?5:2;if(s.spiritTrust>=2){s.butterfly++;s.discoveryCount++;msg='Your spirit ally brings a Lunar Butterfly and Moon Essence!'}else msg='Forest echoes grant Moon Essence.'}
 s.expeditions++;note('✧ '+msg);toast(msg);
}
function discoveries(){return `<h2>🦋 Magical Discoveries</h2><p class="muted">Gathering and expeditions can reveal rare materials and story clues. All discoveries remain in your Journal.</p><div class="grid"><div class="panel"><h3>🦋 Lunar Butterfly</h3><h2>${s.butterfly}</h2><p class="muted small">Found occasionally through Woodcutting or by exploring butterfly crossings. Required for Awakening I.</p></div><div class="panel"><h3>✧ Moon Essence</h3><h2>${s.essence}</h2><p class="muted small">Gathered slowly or earned through expedition decisions.</p></div><div class="panel"><h3>🌙 Recorded discoveries</h3><h2>${s.discoveryCount}</h2><p class="muted small">Moonlit bark, butterflies, and other unusual findings.</p></div></div><section class="panel"><h3>Discovery History</h3><div class="log">${s.log.filter(x=>/discover|butterfly|Moonlit|Butterfly/i.test(x)).map(x=>`<p>${x}</p>`).join('')||'<p class="muted">No magical discoveries recorded yet.</p>'}</div></section>`}
function legacy(){let canAwaken=s.clue&&s.wood>=20&&s.essence>=8&&s.butterfly>=1;let canRestore=s.awakened&&s.wood>=40&&s.essence>=12;return `<div class="row"><div><h2>🌙 The Vioverse Legacy</h2><p class="muted small">A permanent story of Seraphine and the Ancient Moonwood Tree</p></div><span class="pill">${s.restored?'✦ Legacy Complete':'Legacy in Progress'}</span></div><div class="scene ${s.restored?'restored':''}"><div><span class="tag">${s.restored?'A living world':'A forgotten world'}</span><h2>${s.restored?'Moonwood Reborn':'The Ancient Moonwood'}</h2></div></div><div class="grid"><div class="panel"><h3>1. Discover the Ancient Tree ${s.shrineFound?'✓':''}</h3><p class="muted small">Find the Forgotten Moonwood during an expedition.</p><span class="pill">${s.shrineFound?'Completed':'Not discovered'}</span></div><div class="panel"><h3>2. Learn the Ritual ${s.clue?'✓':''}</h3><p class="muted small">Investigate the tree's inscription in the Grove.</p><span class="pill">${s.clue?'Completed':'Requires discovery'}</span></div><div class="panel"><h3>3. Seraphine — Awakening I ${s.awakened?'✓':''}</h3><p class="muted small">Requires 20 Wood · 8 Essence · 1 Lunar Butterfly. Unlocks +15% gathering efficiency, extra wood, and a radiant card border.</p>${s.awakened?'<span class="pill">✦ Awakened</span>':button('Awaken Seraphine','awaken',!canAwaken)}</div><div class="panel"><h3>4. Restore the Moonwood ${s.restored?'✓':''}</h3><p class="muted small">Requires Awakening I, 40 Wood, and 12 Essence. Permanently transforms the Grove and grants +10% gathering efficiency.</p>${s.restored?'<span class="pill">🌸 Moonwood Reborn</span>':button('Restore the Ancient Tree','restore',!canRestore)}</div></div><div class="notice">${nextStep()}</div>${button('Explore the Whispering Grove','expeditions',false,true)}</div>`}
const PATCHES=[
 {name:'Patch 01 · Gathering Reliability',version:'v0.3',status:'Implemented',summary:'Gathering, XP, leveling, and offline simulation improvements.',details:[
  'Automatic Woodcutting continues without a Start/Pause button.',
  'Gathering cycles consistently award wood, character XP, and Woodcutting XP.',
  'Offline gathering is capped at 8 hours and resumes from partial-cycle progress.',
  'Removed the 6,000-cycle simulation cutoff that could silently lose long-session rewards.',
  'Grouped rare-discovery log messages during offline simulation to avoid flooding the Journal.',
  'Existing v0.2 browser saves are reused.'
 ]},
 {name:'Patch 02 · Meaningful Expeditions',version:'v0.4',status:'Available to apply',summary:'Make expedition decisions change routes, story flags, and future outcomes.',details:[
  'Create encounters with distinct consequences rather than interchangeable resource rewards.',
  'Add requirements and alternative solutions for Seraphine.',
  'Record important decisions and change later encounters.',
  'Test all story branches and avoid dead ends.'
 ]},
 {name:'Patch 03 · Discovery Inventory',version:'Planned',status:'Not implemented',summary:'Connect rare discoveries to item inventory and Legacy progress.',details:[
  'Introduce named discovery items and clear rarity tiers.',
  'Show newly discovered materials and their uses.',
  'Keep discovery rewards consistent after reload.'
 ]},
 {name:'Patch 04 · Awakening Clarity',version:'Planned',status:'Not implemented',summary:'Improve Awakening requirements, progress, and bonuses.',details:[
  'Show live material requirements and missing resources.',
  'Explain Awakening I bonuses before purchase.',
  'Test upgrades, costs, and persistence.'
 ]}
];
function patchNotes(){const p=PATCHES[patchIndex];const status=patchIndex===1&&s.patch02?'Applied':p.status;return `<div class="row"><div><h2>📜 Patch Notes</h2><p class="muted small">Vioverse development roadmap · see what is implemented and what is planned</p></div><span class="pill">${p.version} · ${status}</span></div><section class="panel"><div class="row"><h3 style="font-size:25px">${p.name}</h3><span class="pill">${status}</span></div><p class="muted">${p.summary}</p>${p.details.map(x=>`<p>✦ ${x}</p>`).join('')}<div class="row" style="margin-top:22px">${button('← Previous Patch','prevpatch',patchIndex===0,true)}${button(patchIndex===PATCHES.length-1?'Back to Patch 01':'Next Patch →','nextpatch',false)}${patchIndex===1?button(s.patch02?'✓ Patch 02 Applied':'✦ Apply Patch 02 Now','applypatch02',s.patch02):''}</div><p class="muted small">Next Patch moves to the next patch. Apply Patch 02 Now activates the bundled expedition improvements and saves the change. Future patches require new game builds.</p></section><section class="panel"><h3>Development progress</h3><p>✓ Patch 01 — Gathering reliability</p><p class="muted">${s.patch02?'✓ Patch 02 — Expeditions applied':'○ Patch 02 — Ready to apply'} · ○ Patch 03 — Inventory · ○ Patch 04 — Awakening</p></section>`}
function render(){const sc=document.querySelector('.cards');if(sc)scrollPos=sc.scrollLeft;document.getElementById('nav').innerHTML=['Home','Expeditions','Discoveries','Legacy','Patch Notes'].map(n=>`<button data-page="${n}" class="${page===n?'active':''}">${({Home:'♙',Expeditions:'✧',Discoveries:'🦋',Legacy:'🌙','Patch Notes':'📜'})[n]} &nbsp;${n}</button>`).join('');document.getElementById('main').innerHTML=({Home:home,Expeditions:expeditions,Discoveries:discoveries,Legacy:legacy,'Patch Notes':patchNotes})[page]();document.getElementById('wood').textContent=fmt(s.wood);document.getElementById('essence').textContent=fmt(s.essence);document.getElementById('butterfly').textContent=fmt(s.butterfly);document.getElementById('level').textContent=level(s.xp);if(page==='Home'&&document.querySelector('.cards'))document.querySelector('.cards').scrollLeft=scrollPos}
document.addEventListener('click',e=>{const t=e.target.closest('[data-page],[data-action]');if(!t)return;if(t.dataset.page){page=t.dataset.page;flipped=false}else{const a=t.dataset.action;if(a==='nextpatch'){patchIndex=(patchIndex+1)%PATCHES.length;if(patchIndex===1&&!s.patch02){s.patch02=true;note('📜 Patch 02 installed: meaningful expedition branches unlocked');toast('Patch 02 applied! New expedition paths are live.')}}else if(a==='applypatch02'){if(!s.patch02){s.patch02=true;note('📜 Patch 02 installed: meaningful expedition branches unlocked');toast('Patch 02 applied! Explore the Grove.')}}else if(a==='prevpatch'){patchIndex=Math.max(0,patchIndex-1)}else if(a==='flip')flipped=!flipped;else if(a==='legacy'||a==='expeditions')page=a==='legacy'?'Legacy':'Expeditions';else if(a==='skill'&&s.skill>0&&s.skillSpent<5){s.skillSpent++;s.skill--;toast('Forest Mastery improved!')}else if(a.startsWith('choose'))resolveChoice(+a.slice(6));else if(a==='awaken'&&s.clue&&s.wood>=20&&s.essence>=8&&s.butterfly>=1&&!s.awakened){s.wood-=20;s.essence-=8;s.butterfly--;s.awakened=true;note('✦ Seraphine reached Awakening I!');toast('Seraphine Awakened! Her card has transformed.')}else if(a==='restore'&&s.awakened&&s.wood>=40&&s.essence>=12&&!s.restored){s.wood-=40;s.essence-=12;s.restored=true;note('🌸 MOONWOOD REBORN — the Grove will remember forever');toast('The Ancient Moonwood has been restored!')}}save();render()});
const away=Math.max(0,Math.min((Date.now()-s.last)/1000,28800));if(away>10){const before=s.cycles;advance(away);note('⏳ Offline gathering: '+(s.cycles-before)+' cycles completed');setTimeout(()=>toast('Welcome back! '+(s.cycles-before)+' gathering cycles completed.'),500)}save();render();let prev=Date.now();setInterval(()=>{const now=Date.now();advance((now-prev)/1000);prev=now;save();if(page==='Home'||page==='Discoveries'||page==='Legacy')render();else{document.getElementById('wood').textContent=fmt(s.wood);document.getElementById('essence').textContent=fmt(s.essence);document.getElementById('butterfly').textContent=fmt(s.butterfly);document.getElementById('level').textContent=level(s.xp)}},1000);
</script></body></html>
