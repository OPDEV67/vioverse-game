name: Build Vioverse Audio Assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_audio.py'
      - '.github/workflows/build-audio.yml'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthesis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install numpy scipy
      - name: Generate original audio files
        run: python scripts/generate_audio.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish Vioverse original theme and sound effects"
            git push
          fi
